name: generate snake alt (snake-and-commits)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake-and-commits svg
        uses: dahan8473/snake-and-commits@v1
        with:
          github_user: Danol-Noumbi
          output: dist/snake.svg
          theme: green

      - name: push snake svg to the output-alt branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output-alt
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}